name: pharmaflow
description: Ma Pharmacie - Gestion pharmaceutique dédiée à chaque client
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.15.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.10

  # State management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.0.0

  # Local database
  sqflite: ^2.3.0
  path: ^1.8.3

  # UI
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.66.0
  animations: ^2.0.8
  lottie: ^3.0.0

  # Utils
  intl: ^0.20.2
  uuid: ^4.3.3
  url_launcher: ^6.2.4
  connectivity_plus: ^5.0.2
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  permission_handler: ^11.2.0
  mobile_scanner: ^4.0.0
  local_auth: ^2.1.8

  # Export
  pdf: ^3.10.8
  excel: ^4.0.2
  path_provider: ^2.1.2
  share_plus: ^7.2.2

  # Network
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1

  # Forms
  reactive_forms: ^17.0.1

  # Notifications
  flutter_local_notifications: ^17.2.1

  # Icons & Fonts
  cupertino_icons: ^1.0.6
  phosphor_flutter: ^2.0.1
  google_fonts: ^6.2.1

dev_dependencies:
  sqflite_common_ffi: 2.3.6
  sqlite3: ^2.9.0
  fake_cloud_firestore: ^2.5.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  json_serializable: ^6.7.1
  json_annotation: ^4.8.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/3.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
